services:
  bridge:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "20129"
      HOST: "0.0.0.0"
      OPENCODE_CACHE_DIR: /data/cache
      # The panel writes the egress proxy here. Without this the setting is lost
      # on every `docker compose up -d` recreate (the container FS is ephemeral).
      OPENCODE_BRIDGE_STATE_DIR: /data/state
      # The image is the unit of deployment: an in-place self-update is
      # reverted by the next `docker compose build`. Upgrade with
      # `docker compose build --pull && docker compose up -d` instead.
      AUTO_UPDATE: "0"
    volumes:
      - bridge-cache:/data/cache
      - bridge-state:/data/state
    # Loopback only. The bridge has no authentication (the API key is
    # literally "public"), so publishing on 0.0.0.0 would expose an open
    # relay to the whole network.
    ports:
      - "127.0.0.1:20129:20129"
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://127.0.0.1:'+(process.env.PORT||'20129')+'/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  bridge-cache:
  bridge-state:
